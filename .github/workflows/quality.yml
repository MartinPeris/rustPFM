name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Complete quality harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust and quality tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          ./scripts/install-quality-tools.sh
      - name: Run local and CI quality checks
        run: ./scripts/check.sh
      - name: Preserve performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-report
          path: target/performance/
          if-no-files-found: warn
          retention-days: 30
  compatibility:
    name: Rust ${{ matrix.rust }} / ${{ matrix.features }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.0', stable]
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install '${{ matrix.rust }}' --profile minimal
      - name: Test supported configuration
        run: cargo +${{ matrix.rust }} test --locked ${{ matrix.features }}
  interoperability:
    name: Independent Netpbm interoperability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install independent converter
        run: sudo apt-get update && sudo apt-get install -y netpbm
      - name: Reproduce independent fixtures
        run: python3 tests/fixtures/netpbm/generate.py --check
      - name: Decode rustPFM output with Netpbm
        run: cargo test --locked --no-default-features --test netpbm -- --ignored
      - name: Check codec against fixtures
        run: cargo test --locked --no-default-features --test codec independent_netpbm_fixtures
  quality:
    name: Quality gate
    if: always()
    needs: [harness, compatibility, interoperability]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          HARNESS: ${{ needs.harness.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          INTEROPERABILITY: ${{ needs.interoperability.result }}
        run: test "$HARNESS" = success && test "$COMPATIBILITY" = success && test "$INTEROPERABILITY" = success
