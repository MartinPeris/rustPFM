[package]
name = "rustpfm"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "A lightweight Portable Float Map image codec for Rust (work in progress)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MartinPeris/rustPFM"
keywords = ["pfm", "image", "depth", "float"]
categories = ["multimedia::images", "encoding"]
# Remove only when the codec, compatibility policy, and release checks are ready.
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

